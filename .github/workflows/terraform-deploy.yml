name: Terraform Deploy

on:
  push:
    branches: [ dev, staging ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        id: build
        run: npm run build

      - name: Run tests
        run: npm test || true

  deploy-dev:
    needs: build
    if: github.ref == 'refs/heads/dev' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev')
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::418056594463:role/github-user
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: infra/terraform-aws
        run: terraform init -backend-config="environments/dev/backend.tfvars"

      - name: Terraform Plan
        working-directory: infra/terraform-aws
        run: |
          terraform plan -var-file="environments/dev/terraform.tfvars" \
            -var="certificate_arn=${{ secrets.ACM_CERTIFICATE_ARN }}" \
            -var="db_username=${{ secrets.DB_USERNAME }}" \
            -var="db_password=${{ secrets.DB_PASSWORD }}" \
            -var="supabase_jwt_secret=${{ secrets.SUPABASE_JWT_SECRET }}" \
            -var="supabase_anon_key=${{ secrets.SUPABASE_ANON_KEY }}" \
            -var="supabase_service_role_key=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -var="supabase_dashboard_password=${{ secrets.SUPABASE_DASHBOARD_PASSWORD }}"

      - name: Terraform Apply
        working-directory: infra/terraform-aws
        run: |
          terraform apply -var-file="environments/dev/terraform.tfvars" \
            -var="certificate_arn=${{ secrets.ACM_CERTIFICATE_ARN }}" \
            -var="db_username=${{ secrets.DB_USERNAME }}" \
            -var="db_password=${{ secrets.DB_PASSWORD }}" \
            -var="supabase_jwt_secret=${{ secrets.SUPABASE_JWT_SECRET }}" \
            -var="supabase_anon_key=${{ secrets.SUPABASE_ANON_KEY }}" \
            -var="supabase_service_role_key=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -var="supabase_dashboard_password=${{ secrets.SUPABASE_DASHBOARD_PASSWORD }}" \
            -auto-approve

  deploy-staging:
    needs: build
    if: github.ref == 'refs/heads/staging' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::418056594463:role/github-user
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: infra/terraform-aws
        run: terraform init -backend-config="environments/staging/backend.tfvars" -reconfigure

      - name: Terraform Plan
        working-directory: infra/terraform-aws
        run: |
          terraform plan -var-file="environments/staging/terraform.tfvars" \
            -var="certificate_arn=${{ secrets.ACM_CERTIFICATE_ARN }}" \
            -var="db_username=${{ secrets.DB_USERNAME }}" \
            -var="db_password=${{ secrets.DB_PASSWORD }}" \
            -var="supabase_jwt_secret=${{ secrets.SUPABASE_JWT_SECRET }}" \
            -var="supabase_anon_key=${{ secrets.SUPABASE_ANON_KEY }}" \
            -var="supabase_service_role_key=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -var="supabase_dashboard_password=${{ secrets.SUPABASE_DASHBOARD_PASSWORD }}"

      - name: Terraform Apply
        working-directory: infra/terraform-aws
        run: |
          terraform apply -var-file="environments/staging/terraform.tfvars" \
            -var="certificate_arn=${{ secrets.ACM_CERTIFICATE_ARN }}" \
            -var="db_username=${{ secrets.DB_USERNAME }}" \
            -var="db_password=${{ secrets.DB_PASSWORD }}" \
            -var="supabase_jwt_secret=${{ secrets.SUPABASE_JWT_SECRET }}" \
            -var="supabase_anon_key=${{ secrets.SUPABASE_ANON_KEY }}" \
            -var="supabase_service_role_key=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -var="supabase_dashboard_password=${{ secrets.SUPABASE_DASHBOARD_PASSWORD }}" \
            -auto-approve
