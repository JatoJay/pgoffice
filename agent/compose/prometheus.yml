global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "node"
    static_configs:
      - targets: ["node_exporter:9100"]

  - job_name: "postgres"
    static_configs:
      - targets: ["postgres_exporter:9187"]

remote_write:
  - url: ${INGEST_REMOTE_WRITE_URL}
    headers:
      Authorization: "Bearer ${INGEST_API_KEY}"
