version: "3.9"

services:
  postgres:
    image: postgres:16.2
    environment:
      POSTGRES_USER: pgmonitor
      POSTGRES_PASSWORD: pgmonitor
      POSTGRES_DB: pgmonitor
    ports:
      - "5432:5432"
    volumes:
      - pgmonitor-db:/var/lib/postgresql/data

  redis:
    image: redis:7.2
    ports:
      - "6379:6379"

  onlyoffice:
    image: onlyoffice/documentserver:latest
    ports:
      - "8080:80"
    environment:
      - JWT_ENABLED=true
      - JWT_SECRET=pgmonitor_onlyoffice_secret
    volumes:
      - onlyoffice-data:/var/www/onlyoffice/Data
      - onlyoffice-logs:/var/log/onlyoffice

volumes:
  pgmonitor-db:
  onlyoffice-data:
  onlyoffice-logs:
